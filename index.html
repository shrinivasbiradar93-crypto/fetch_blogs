    <title>Blogs using fetch</title>

<body>
    <h3 class="text-center bg-dark py-2 text-white">Blogs Using Fetch</h3>

    <div id="spinner" class="text-center d-none mt-3">
        <div class="spinner-border text-primary" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
    
    <div class="container mt-3">
        <div class="row">
            <div class="col-md-6 offset-3">
                <div class="card bg-light">
                    <div class="card-body">
                        <form id="form">
                            <div class="form-group">
                                <label for="title">Title</label>
                                <input type="text" id="title" required placeholder="Enter title..." class="form-control">
                            </div>
                            <div class="form-group">
                                <label for="content">Content</label>
                              <textarea name=" " id="content" placeholder="Enter content..." class="form-control"></textarea>
                            </div>
                            <div class="form-group">
                                <label for="userId">UserId</label>
                                <input type="number" id="userId" placeholder="Enter userId..." class="form-control">
                            </div>
                            <button type="submit" id="addBlogs" class="btn btn-sm btn-block btn-primary">Add Blogs</button>
                            <button type="button" id="updateBlogs" class="btn btn-sm btn-block btn-success d-none">Update Blogs</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
